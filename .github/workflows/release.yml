name: Release

# Bouton « Run workflow » dans l'onglet Actions : compile Exotique.exe et publie la release.
# Avant de cliquer : <Version> à jour dans Exotique.csproj, et notes de version dans .github/release-notes.md.

on:
  workflow_dispatch:
    inputs:
      clean_start:
        description: "Clean start: delete ALL existing releases, tags and past workflow runs before publishing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild Exotique.csproj -getProperty:Version | tr -d '\r[:space:]')
          IFS=. read -r major minor patch _ <<< "$version"
          if [ -n "$patch" ] && [ "$patch" != "0" ]; then tag="v$major.$minor.$patch"; else tag="v$major.$minor"; fi
          echo "Version $version, tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Clean start
        if: ${{ inputs.clean_start }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            echo "Deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
          for tag in $(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name'); do
            echo "Deleting tag $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[].id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            echo "Deleting workflow run $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || echo "  (could not delete run $id)"
          done

      - name: Stop if this release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Un brouillon laissé par un essai interrompu est repris ; une release publiée, non.
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::error::The release $TAG already exists. Raise <Version> in Exotique.csproj first."
            exit 1
          fi

      - name: Publish Exotique.exe
        run: >
          dotnet publish Exotique.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          hash=$(sha256sum publish/Exotique.exe | cut -d' ' -f1)
          { cat .github/release-notes.md; printf '\nSHA-256 `Exotique.exe`: `%s`\n' "$hash"; } > notes.md

          # GitHub répond parfois 502 pendant l'envoi : brouillon d'abord, envoi de l'exe avec plusieurs essais, puis publication.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "Attempt $i failed, retrying in 20 s"; sleep 20; done; return 1; }

          # Un 502 peut arriver alors que le brouillon a bien été créé : on vérifie avant de recommencer.
          draft() {
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release edit "$TAG" --title "Exotique $TAG" --notes-file notes.md --target "$GITHUB_SHA"
            else
              gh release create "$TAG" --draft --title "Exotique $TAG" --notes-file notes.md --target "$GITHUB_SHA"
            fi
          }
          retry draft
          retry gh release upload "$TAG" publish/Exotique.exe --clobber
          retry gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size) bytes")'
